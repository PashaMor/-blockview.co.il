# Codemagic CI — builds the Capacitor iOS app on a cloud Mac and ships it to TestFlight.
# One-time setup in the Codemagic UI (see store/ios/SETUP.md):
#   1. Connect this GitHub repo (PashaMor/-blockview.co.il).
#   2. Team settings → Integrations → App Store Connect → add an API key,
#      and name the integration EXACTLY:  BlockView ASC
#   3. Run the "ios-testflight" workflow.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: BlockView ASC        # must match the integration name you create
    environment:
      groups:
        - ios_signing        # Codemagic variable group holding CERTIFICATE_PRIVATE_KEY (secure)
      vars:
        BUNDLE_ID: "com.blockview.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest                            # Apple now requires the iOS 26 SDK (Xcode 26+)
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Capacitor sync iOS (copies www + plugins into the Xcode project)
        script: npx cap sync ios
      - name: Generate iOS app icons
        script: npx capacitor-assets generate --ios || true
      - name: Pod install
        script: cd ios/App && pod install
      - name: Set build number from Codemagic build index
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Set up code signing (reuse persisted distribution cert)
        script: |
          set -ex
          keychain initialize
          # Reuse the SAME distribution certificate on every build via a private key
          # persisted in Codemagic (secure env CERTIFICATE_PRIVATE_KEY). fetch-signing-files
          # finds the existing cert that matches this key instead of minting a new one,
          # so we never hit Apple's distribution-certificate cap. First run with a free
          # cert slot creates the one cert; every run after reuses it.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create \
            --platform IOS \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload to App Store Connect only. The build is immediately available to
        # INTERNAL testers (no beta review needed). We do NOT auto-submit for
        # EXTERNAL beta review because that requires Test Information (feedback
        # email + review contact) filled once in App Store Connect.
        # To enable external testing later: fill test-info, then flip this to true
        # and add beta_groups below.
        submit_to_testflight: false
        # beta_groups:
        #   - "External Testers"
