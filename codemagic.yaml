# Codemagic CI — builds the Capacitor iOS app on a cloud Mac and ships it to TestFlight.
# One-time setup in the Codemagic UI (see store/ios/SETUP.md):
#   1. Connect this GitHub repo (PashaMor/-blockview.co.il).
#   2. Team settings → Integrations → App Store Connect → add an API key,
#      and name the integration EXACTLY:  BlockView ASC
#   3. Run the "ios-testflight" workflow.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: BlockView ASC        # must match the integration name you create
    environment:
      vars:
        BUNDLE_ID: "com.blockview.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest                            # Apple now requires the iOS 26 SDK (Xcode 26+)
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Capacitor sync iOS (copies www + plugins into the Xcode project)
        script: npx cap sync ios
      - name: Generate iOS app icons
        script: npx capacitor-assets generate --ios || true
      - name: Pod install
        script: cd ios/App && pod install
      - name: Set build number from Codemagic build index
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Set up code signing (create cert + profile if missing)
        script: |
          set -ex
          keychain initialize
          # Generate a private key locally — a new distribution certificate is
          # created FROM this key, so its identity is usable on this machine
          # (existing Expo/RevenueCat certs can't be reused; their keys live elsewhere).
          openssl genrsa -out /tmp/blockview_cert_key.pem 2048
          # Create + download the distribution cert (from our key) AND the App Store
          # provisioning profile for the bundle id, in one go.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/blockview_cert_key.pem \
            --create \
            --platform IOS \
            --verbose
          # Load cert + key into the build keychain, then apply the profile to Xcode.
          keychain add-certificates
          xcode-project use-profiles --verbose
          echo "--- Provisioning profiles present: ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Optional: auto-add the build to a TestFlight group once processed.
        # beta_groups:
        #   - "Internal Testers"
